<style>
/* Layout: one narrow column (phone-first). Header with language menu, tabs, inputs card, then a receipt-style result. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#15201B; --muted:#5C6A64; --line:#D9E1DD;
  --accent:#0E6A55; --accent-ink:#FFFFFF; --accent-soft:#E0EFE9; --interest:#B5532B; --interest-soft:#F6E6DE;
  --f-lang:"IBM Plex Sans KR";
  --f-body:var(--f-lang),"IBM Plex Sans KR","Noto Sans SC","Noto Sans Devanagari","Noto Sans Khmer","Noto Sans Thai","Noto Sans Myanmar","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Do Hyeon",var(--f-body);
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
:root[data-lx]{--f-display:var(--f-body)}
:root[data-lx] h2{font-weight:700;font-size:20px}
:root[data-lx] .brand{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E6EDEA; --muted:#93A29C; --line:#28332F;
  --accent:#4CC3A0; --accent-ink:#0B1411; --accent-soft:#1A2E27; --interest:#E38B60; --interest-soft:#33231C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E6EDEA; --muted:#93A29C; --line:#28332F;
  --accent:#4CC3A0; --accent-ink:#0B1411; --accent-soft:#1A2E27; --interest:#E38B60; --interest-soft:#33231C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
:root[lang="my"] body,:root[lang="km"] body,:root[lang="th"] body,:root[lang="ne"] body{line-height:1.8}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand{font-family:"Do Hyeon",var(--f-body);font-size:34px;line-height:1;letter-spacing:-.5px}
.brand b{color:var(--accent);font-weight:400}
a.brand{color:inherit;text-decoration:none}
.tag{color:var(--muted);font-size:13px}
.langsel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 6px 0 12px}
.langsel svg{flex:0 0 auto;color:var(--muted)}
.langsel select{border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:8px 4px;cursor:pointer;max-width:11em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font:600 15px var(--f-body);border:0;border-radius:7px;padding:11px 14px;background:transparent;color:var(--muted);cursor:pointer;line-height:1.25;white-space:nowrap}
.inbox input[type="date"]{text-align:left;font:500 16px var(--f-num);min-height:2.6em}
tr.on td{background:var(--accent-soft);font-weight:600}
#lv-body td:first-child{white-space:normal;min-width:7em}
.warn{border:1px solid var(--interest);background:var(--interest-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row > *{min-width:0}
.inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px}
.inbox:focus-within{border-color:var(--accent)}
.inbox input,.inbox select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 18px var(--f-num);padding:11px 0;outline:none;text-align:right}
.inbox select{text-align:left;font:600 15px var(--f-body);cursor:pointer}
.inbox span{color:var(--muted);font-size:14px;margin-left:6px;white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted);min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.seg button{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:10px 6px;cursor:pointer;line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/* receipt */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px;position:relative}
.receipt::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:6px;
  background:radial-gradient(circle at 6px 6px,var(--bg) 4px,transparent 4.5px) 0 0/12px 12px repeat-x}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.big{font:600 40px/1.1 var(--f-num);letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--accent);overflow-wrap:anywhere}
.big small{font:500 16px var(--f-body);color:var(--ink);margin-left:4px;letter-spacing:0}
.dash{border:0;border-top:1px dashed var(--line);margin:2px 0}
.lines{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lines li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lines li span:first-child{color:var(--muted);min-width:0}
.lines li span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.lines li.strong span{color:var(--ink);font-weight:600}

textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13.5px/1.6 var(--f-body);padding:10px 12px;resize:vertical;min-height:110px}
.btn{font:600 15px var(--f-body);border:0;border-radius:8px;padding:12px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{font-size:13px;color:var(--accent);font-weight:600}

/* itemized */
.people{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.person{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);padding:2px 4px 2px 10px}
.person input{width:6em;border:0;background:transparent;color:var(--ink);font:500 14px var(--f-body);padding:5px 0;outline:none}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;width:26px;height:26px;border-radius:50%;cursor:pointer}
.x:hover{background:var(--line);color:var(--ink)}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.item-top{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.item-top > *{min-width:0}
.item-top .inbox{background:var(--surface)}
.item-top .name input{text-align:left;font:600 15px var(--f-body)}

/* loan */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font:600 20px var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted)}
.stat.int .v{color:var(--interest)}
.split{height:14px;border-radius:999px;overflow:hidden;display:flex;background:var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp-row{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center;font-size:13.5px}
.cmp-row .nm{min-width:0;line-height:1.3;overflow-wrap:anywhere}
.cmp-row .bar{position:relative;height:28px;background:var(--bg);border-radius:6px;overflow:hidden}
.cmp-row .bar i{position:absolute;inset:0 auto 0 0;background:var(--interest-soft);border-right:2px solid var(--interest)}
.cmp-row .bar b{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 13px var(--f-num);font-variant-numeric:tabular-nums}
.cmp-row.on .bar i{background:var(--interest);opacity:.85}
.cmp-row.on .nm{font-weight:700}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:600;font-size:12px}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:center}
tbody tr:nth-child(12n) td{border-bottom-color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0}
footer{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.sharebox{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.sharebox .btn{display:inline-flex;align-items:center;gap:8px}
.sharelink{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:12.5px var(--f-num);padding:9px 10px}
@media (max-width:420px){.big{font-size:34px}.item-top{grid-template-columns:1fr auto}.item-top .amt{grid-column:1 / -1;grid-row:2}}
@media (prefers-reduced-motion:no-preference){.cmp-row .bar i,.split i{transition:width .35s ease}}

.pwa{margin:0 0 10px}
.pwa-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pwa-btn:hover{background:var(--accent);color:var(--accent-ink)}
.pwa-ios{margin:0;font-size:12px;color:var(--muted)}
.wrap.wide{max-width:720px}
.sitenav{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
.sitenav a{color:var(--muted);text-decoration:none;padding:2px 0}
.sitenav a:hover,.sitenav a[aria-current="page"]{color:var(--ink)}
.sitenav a[aria-current="page"]{font-weight:700}
footer .footlinks{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px}
footer .footlinks a{color:var(--muted)}
main.page{display:flex;flex-direction:column;gap:18px}
.crumb{font-size:13px;color:var(--muted)}.crumb a{color:var(--muted)}
.page h1{font:700 28px/1.3 var(--f-body);margin:0;text-wrap:balance;letter-spacing:-.3px}
.byline{font-size:13px;color:var(--muted)}
.prose{display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.75}
.prose > *{margin:0}
.prose p,.prose ul{max-width:68ch}
.prose ul{padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.prose h2{font:700 20px/1.4 var(--f-body);margin-top:14px;letter-spacing:-.2px}
.prose h3{font:700 16.5px/1.4 var(--f-body);margin-top:4px}
.prose .lede{font-size:17px}
.prose a{color:var(--accent)}
.prose a.btn{color:var(--accent-ink)}
.prose table{min-width:0;font-size:14.5px}
.prose th,.prose td{text-align:left;white-space:normal;font-family:var(--f-body);vertical-align:top}
.prose td+td{font-variant-numeric:tabular-nums}
.prose tr.strong td{font-weight:700;color:var(--ink)}
.small{font-size:13px!important;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;margin-top:8px}
.cta b{display:block;font-size:16px}.cta span{color:var(--muted);font-size:14px}
.cta .btn,.card .btn{text-decoration:none;display:inline-block}
.callout{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.callout .mail{font:600 20px var(--f-num);overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font:700 17px/1.4 var(--f-body)}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.glist{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.glist a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.glist a:last-child{border-bottom:0}
.glist a:hover b{color:var(--accent)}
.glist b{font-size:15.5px}.glist span{font-size:13.5px;color:var(--muted)}
.sec-h{font:700 18px var(--f-body);margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandbox">
      <a class="brand" href="/zh/">Easy<b>Calc</b></a>
      <div class="tag" data-t="tag"></div>
    </div>
    <label class="langsel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <select id="langSel" aria-label="Language / 언어"></select>
    </label>
  </header>
  <nav class="sitenav"><a href="/en/guide/">指南</a><a href="/en/about/">关于</a></nav>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-salary" aria-controls="salary" aria-selected="false" data-t="tabSalary"></button>
    <button role="tab" id="tab-severance" aria-controls="severance" aria-selected="false" data-t="tabSev"></button>
    <button role="tab" id="tab-leave" aria-controls="leave" aria-selected="false" data-t="tabLeave"></button>
    <button role="tab" id="tab-loan" aria-controls="loan" aria-selected="false" data-t="tabLoan"></button>
    <button role="tab" id="tab-saving" aria-controls="saving" aria-selected="false" data-t="tabSave"></button>
    <button role="tab" id="tab-dutch" aria-controls="dutch" aria-selected="true" data-t="tabDutch"></button>
  </div>

  <!-- ===== 더치페이 / Bill split ===== -->
  <section class="panel" id="dutch" role="tabpanel" aria-labelledby="tab-dutch">
    <div class="card">
      <div><h2 data-t="dutchH"></h2><p class="lede" data-t="dutchLede"></p></div>
      <div class="seg" role="group">
        <button id="mode-simple" aria-pressed="true" data-t="modeSimple"></button>
        <button id="mode-items" aria-pressed="false" data-t="modeItems"></button>
      </div>

      <div id="simpleBox" class="panel">
        <div class="row">
          <div class="field"><label for="d-total" data-t="total"></label>
            <div class="inbox"><input id="d-total" inputmode="numeric" value="87,000"><span data-t="cur"></span></div>
            <div class="hint" id="d-total-kr"></div></div>
          <div class="field"><label for="d-people" data-t="people"></label>
            <div class="inbox"><input id="d-people" inputmode="numeric" value="4"><span data-t="ppl"></span></div></div>
        </div>
      </div>

      <div id="itemsBox" class="panel" hidden>
        <div class="field"><span class="lbl" data-t="attendees"></span>
          <div class="people" id="peopleList"></div></div>
        <div class="field"><span class="lbl" data-t="itemsLbl"></span>
          <div class="panel" id="itemList" style="gap:10px"></div>
          <div class="btnrow"><button class="btn ghost" id="addItem" data-t="addItem"></button></div></div>
      </div>

      <div class="field"><span class="lbl" data-t="roundLbl"></span>
        <div class="chips" id="roundChips">

ခုချင်း၏တွက်နည်းတို့ကြောင့် အမှန်ပမာဏ အနည်းငယ်ကွာနိုင်သည်။ အခွန်နှုန်းသည် ထုတ်ကုန်အလိုက် ကွာသဖြင့် ဖွင့်မီ ဘဏ်တွင် မေးပါ။',enterSav:'ပမာဏနှင့် ကာလ ရိုက်ထည့်ပါ',titles:{saving:'ငွေစုနှင့် ငွေပေါင်း အတိုးတွက်စက် · အခွန်ဖြတ်ပြီး | EasyCalc'}}
};for(const l in S){const tt=S[l].titles;delete S[l].titles;Object.assign(window.I18N[l],S[l]);Object.assign(window.I18N[l].titles,tt)}})();
/* 큰 수 읽기 단위 / number words: [threshold, word]..., currency word */
window.I18N_NUM={
 en:[[1e9,'billion'],[1e6,'million'],[1e3,'thousand'],'won'],

};
/* 언어별 글꼴 / per-language web fonts */
window.I18N_FONT={
 vi:['Be Vietnam Pro','Be+Vietnam+Pro:wght@400;500;600;700'],
 zh:['Noto Sans SC','Noto+Sans+SC:wght@400;500;700'],
 ne:['Noto Sans Devanagari','Noto+Sans+Devanagari:wght@400;500;600;700'],

};

<script>
(function(){
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const T=window.I18N,LANGS=Object.keys(T);

/* ---------- 언어 / language ---------- */
const onSite=/(^|\.)easycalc\.co\.kr$/.test(location.hostname);
const pathLang=(location.pathname.match(/^\/([a-z]{2})(\/|$)/)||[])[1];
let lang=LANGS.includes(pathLang)&&pathLang!=='ko'?pathLang:(onSite?'ko':(LANGS.includes(store.get('lang'))?store.get('lang'):'ko'));
const tf=(k,...a)=>{const v=T[lang][k]!==undefined?T[lang][k]:T.en[k];return typeof v==='function'?v(...a):(typeof v==='string'?v.replace(/\{(\d)\}/g,(_,i)=>a[i]):v)};
const t=k=>tf(k);
const num=s=>{const n=Number(String(s).replace(/[^\d.]/g,''));return isFinite(n)?n:0};
const won=n=>Math.round(n).toLocaleString('en-US');
const M=n=>lang==='ko'?won(n)+'원':'₩'+won(n);
const bigM=n=>lang==='ko'?`${won(n)}<small>원</small>`:`<small style="margin:0 2px 0 0">₩</small>${won(n)}`;
function reading(n){n=Math.floor(n);if(!n)return'';
  if(lang==='ko'||lang==='zh'){const e=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4),r=n%1e4,p=[];
    const [E,W,C]=lang==='ko'?['억','만',' 원']:['亿','万',' 韩元'];
    if(e)p.push(e.toLocaleString('en-US')+E);if(m)p.push(m.toLocaleString('en-US')+W);if(r)p.push(r.toLocaleString('en-US'));return p.join(' ')+C}
  const cfg=window.I18N_NUM[lang]||window.I18N_NUM.en,cur=cfg[cfg.length-1];
  for(const [th,w] of cfg.slice(0,-1)){if(n>=th)return (+(n/th).toFixed(2)).toLocaleString('en-US')+' '+w+' '+cur}
  return n.toLocaleString('en-US')+' '+cur}
function salLabel(a){return lang==='ko'?(a>=1e8?(a/1e8)+'억':(a/1e4).toLocaleString('en-US')+'만'):lang==='zh'?(a>=1e8?(a/1e8)+'亿':(a/1e4)+'万'):'₩'+(a/1e6)+'M'}
function fmtInput(el){const v=num(el.value);el.value=v?v.toLocaleString('en-US'):''}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function loadFont(l){const f=window.I18N_FONT[l];
  document.documentElement.style.setProperty('--f-lang',f?`"${f[0]}"`:'"IBM Plex Sans KR"');
  if(!f||document.getElementById('font-'+l))return;
  const ln=document.createElement('link');ln.id='font-'+l;ln.rel='stylesheet';
  ln.href='https://fonts.googleapis.com/css2?family='+f[1]+'&display=swap';document.head.appendChild(ln)}

const sel=$('langSel');
sel.innerHTML=LANGS.map(l=>`<option value="${l}" lang="${l}">${esc(T[l].langName)}</option>`).join('');

let curTab='dutch';
function applyLang(){
  const r=document.documentElement;r.lang=lang;
  if(lang==='ko'||lang==='en')r.removeAttribute('data-lx');else r.setAttribute('data-lx','');
  loadFont(lang);sel.value=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t(el.dataset.t);if(typeof v==='string')el.textContent=v});
  document.querySelectorAll('[data-tp]').forEach(el=>el.placeholder=t(el.dataset.tp));
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ta)));
  document.querySelectorAll('#roundChips [data-unit]').forEach(b=>b.textContent=M(+b.dataset.unit));
  document.querySelectorAll('span[data-t="ppl"]').forEach(s=>s.hidden=!s.textContent);
  document.title=t('titles')[curTab];
}
const PAGE=document.documentElement.dataset.page||'';
const base=l=>l==='ko'?'/':'/'+l+'/';
function setLang(l){
  if(l===lang||!LANGS.includes(l))return;
  if(onSite){location.href=base(l)+(TABS.includes(PAGE)?PAGE+'/'+location.search:'');return}
  const prev=lang;lang=l;store.set('lang',l);
  people.forEach((p,i)=>{if(p.name===T[prev].defPeople[i])p.name=T[l].defPeople[i]});
  items.forEach((it,i)=>{if(it.name===T[prev].defItems[i])it.name=T[l].defItems[i]});
  applyLang();renderAll();calcLoan();calcSav();calcSalary();calcSev();calcLeave();
}
sel.onchange=()=>setLang(sel.value);

/* ---------- tabs ---------- */
const TABS=['salary','severance','leave','loan','saving','dutch'];
function showTab(x0){const x=TABS.includes(x0)?x0:'dutch';curTab=x;
  TABS.forEach(k=>{$(k).hidden=k!==x;$('tab-'+k).setAttribute('aria-selected',k===x)});store.set('tab',x);document.title=t('titles')[x]}
TABS.forEach(k=>$('tab-'+k).onclick=()=>{if(onSite&&PAGE){if(k!==PAGE)location.href=base(lang)+k+'/';return}showTab(k);if(onSite)history.replaceState(null,'','#'+k)});

/* ---------- 더치페이 / bill split ---------- */
let mode='simple',unit=100,uid=0;
const people=T[lang].defPeople.map(n=>({id:++uid,name:n}));
const items=[
  {id:++uid,name:T[lang].defItems[0],amount:120000,who:new Set(people.map(p=>p.id))},
  {id:++uid,name:T[lang].defItems[1],amount:54000,who:new Set([people[0].id,people[1].id,people[3].id])}
];
const d=new Date();$('d-date').textContent=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
function setMode(m){mode=m;$('mode-simple').setAttribute('aria-pressed',m==='simple');$('mode-items').setAttribute('aria-pressed',m==='items');
  $('simpleBox').hidden=m!=='simple';$('itemsBox').hidden=m!=='items';calcDutch()}
$('mode-simple').onclick=()=>setMode('simple');$('mode-items').onclick=()=>setMode('items');
$('roundChips').onclick=e=>{const b=e.target.closest('[data-unit]');if(!b)return;unit=+b.dataset.unit;
  [...$('roundChips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));calcDutch()};
const ceilU=v=>Math.ceil(Math.round(v)/unit)*unit;

function renderPeople(){
  $('peopleList').innerHTML=people.map(p=>`<span class="person"><input id="pn-${p.id}" data-pid="${p.id}" value="${esc(p.name)}" aria-label="${esc(t('attendees'))}">${people.length>2?`<button class="x" data-rm="${p.id}" aria-label="− ${esc(p.name)}">×</button>`:''}</span>`).join('')+
  `<button class="chip" id="addPerson">${esc(t('addPerson'))}</button>`;
}
function renderItems(){
  $('itemList').innerHTML=items.map(it=>`<div class="item" data-iid="${it.id}">
    <div class="item-top">
      <div class="inbox name"><input id="in-${it.id}" data-f="name" value="${esc(it.name)}"></div>
      <div class="inbox amt"><input id="ia-${it.id}" data-f="amount" inputmode="numeric" value="${it.amount?won(it.amount):''}"><span>${esc(t('cur'))}</span></div>
      ${items.length>1?`<button class="x" data-rmi="${it.id}" aria-label="×">×</button>`:'<span></span>'}
    </div>
    <div class="chips">${people.map(p=>`<button class="chip" data-who="${p.id}" aria-pressed="${it.who.has(p.id)}">${esc(p.name||t('noName'))}</button>`).join('')}</div>
  </div>`).join('');
}

function calcDutch(){
  const acc=$('d-account').value.trim(),uTxt=unit>1?M(unit):'';
  let lines=[],share=[];
  if(mode==='simple'){
    const total=num($('d-total').value),n=Math.max(0,Math.floor(num($('d-people').value)));
    $('d-total-kr').textContent=reading(total);
    const each=n?ceilU(total/n):0,col=each*n;
    $('d-headline-label').textContent=tf('perPerson',n);$('d-big').innerHTML=bigM(each);
    lines=[[t('totalAmt'),M(total)],[t('people'),tf('pplN',n)],[t('exact'),n?M(total/n):'-'],[t('collected'),M(col)],[t('leftover'),M(col-total)]];
    share=[tf('shareA',M(total),n),tf('shareB',M(each))+(uTxt?' '+tf('shareRound',uTxt):'')];
  }else{
    const owe=new Map(people.map(p=>[p.id,0]));let total=0;
    items.forEach(it=>{const w=[...it.who].filter(id=>owe.has(id));total+=it.amount;if(w.length)w.forEach(id=>owe.set(id,owe.get(id)+it.amount/w.length))});
    const unassigned=items.filter(it=>it.amount&&![...it.who].some(id=>owe.has(id)));
    let col=0;const per=people.map(p=>{const v=ceilU(owe.get(p.id));col+=v;return[p,v]});
    $('d-headline-label').textContent=t('totalAmt');$('d-big').innerHTML=bigM(total);
    lines=per.map(([p,v])=>[p.name||t('noName'),M(v)]);
    lines.push([t('collected'),M(col),'strong']);lines.push([t('leftover'),M(col-total)]);
    if(unassigned.length)lines.push([t('unassigned'),unassigned.map(i=>i.name).join(', ')]);
    share=[tf('shareHead',M(total)),...items.filter(i=>i.amount).map(i=>`· ${i.name} ${M(i.amount)} (${tf('pplN',[...i.who].filter(id=>owe.has(id)).length)})`),'',
      ...per.map(([p,v])=>`${p.name||t('noName')}: ${M(v)}`)];
    if(uTxt)share.push(tf('shareRound',uTxt));
  }
  if(acc)share.push(t('payTo')+acc);
  $('d-lines').innerHTML=lines.map(([a,b,c])=>`<li class="${c||''}"><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('');
  $('d-share').value=share.join('\n');
}

/* ---------- 대출이자 / loan ---------- */
let method='annuity',showAll=false;
function schedule(P,rate,n,m){
  const r=rate/100/12,rows=[];let bal=P,ti=0;
  const pmt=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  for(let i=1;i<=n;i++){
    const it=Math.round(bal*r);let pr;
    if(i===n)pr=bal;else if(m==='annuity')pr=Math.min(bal,Math.round(pmt)-it);else if(m==='principal')pr=Math.round(P/n);else pr=0;
    bal-=pr;ti+=it;rows.push([i,pr+it,pr,it,Math.max(0,bal)]);
  }
  return{rows,ti,total:P+ti};
}

  $('lg-p').textContent=tf('prinPct',(100-ip).toFixed(1));$('lg-i').textContent=tf('intPct',ip.toFixed(1));
  const all=['annuity','principal','bullet'].map(m=>[m,schedule(P,rate,n,m).ti]),mx=Math.max(...all.map(a=>a[1]))||1;
  $('cmp').innerHTML=all.map(([m,v])=>`<div class="cmp-row ${m===method?'on':''}"><span class="nm">${esc(t('m_'+m))}</span>
    <div class="bar"><i style="width:${Math.max(2,v/mx*100)}%"></i><b>${M(v)}</b></div></div>`).join('');

/* ---------- 예·적금 / deposit & savings ---------- */
let savKind='deposit',savComp='simple',savAll=false;
/* amt: 예금=예치금, 적금=월 납입액(매달 첫날 납입), n: 개월, rate: 연 %, comp: simple|compound, taxPct: 총 세율 % */
function savCalc(kind,amt,rate,n,comp,taxPct){
  const i=rate/1200,pw=Math.pow(1+i,n),principal=kind==='saving'?amt*n:amt;
  let g;
  if(kind==='deposit')g=comp==='compound'?amt*(pw-1):amt*i*n;
  else g=comp==='compound'?(i?amt*(pw-1)/i*(1+i)-principal:0):amt*i*n*(n+1)/2;
  g=Math.floor(g+1e-6);
  const tax=Math.floor(g*taxPct/100+1e-6);
  return{principal,gross:g,tax,net:g-tax,maturity:principal+g-tax};
}
function calcSav(){
  const amt=num($('g-amt').value),rate=Math.min(100,num($('g-rate').value)),tm=Math.floor(num($('g-term').value));
  const n=Math.min(600,$('g-unit').value==='y'?tm*12:tm),tax=Math.min(100,num($('g-tax').value));

    $('g-body').innerHTML=`<tr><td colspan="4" style="text-align:center;font-family:var(--f-body)">${esc(t('enterSav'))}</td></tr>`;$('g-all').hidden=true;return}
  const r=savCalc(savKind,amt,rate,n,savComp,tax),taxTxt=String(+tax.toFixed(2));
  $('g-tag').textContent=tf('savMonthsV',n);
  $('g-big').innerHTML=bigM(r.maturity);$('g-big-s').textContent=reading(r.maturity);
  $('g-lines').innerHTML=linesHTML([[t(savKind==='deposit'?'savPrinD':'savPrinS'),M(r.principal)],[t('savPeriod'),tf('savMonthsV',n)],
    [t('savGross'),M(r.gross)],[tf('savTaxLine',taxTxt),'−'+M(r.tax)],[t('savNetInt'),M(r.net),'strong'],
    [t('savYield'),(r.net/r.principal*100).toFixed(2)+'%']]);
  const np=r.gross?r.net/r.gross*100:100;
  $('g-split-n').style.width=np+'%';$('g-split-t').style.width=(100-np)+'%';
  $('g-lg-n').textContent=tf('savLgN',np.toFixed(1));$('g-lg-t').textContent=tf('savLgT',(100-np).toFixed(1));
  if(savKind==='saving'){half.textContent=tf('savHalf',String(rate),(r.gross/r.principal*100).toFixed(2));half.hidden=false}
  if(r.gross>20000000){warn.textContent=t('savWarn');warn.hidden=false}
  const cnt=savAll?n:Math.min(12,n),rows=[];
  for(let k=1;k<=cnt;k++){const x=savCalc(savKind,amt,rate,k,savComp,tax);rows.push(`<tr><td>${k}</td><td>${won(x.principal)}</td><td>${won(x.gross)}</td><td>${won(x.net)}</td></tr>`)}
  $('g-body').innerHTML=rows.join('');
  $('g-all').textContent=savAll?t('show12'):tf('showAll',n);$('g-all').hidden=n<=12;
}

/* ---------- 연봉 실수령 / take-home (2026.7 rates) ---------- */
let sev=0,whr=100;
const fl10=v=>Math.floor(v/10)*10;
/* 간이세액표 조회 / withholding lookup (월급여액 m원, 가족 수, 8~20세 자녀 수, 원천징수 비율 %) */
function whBase(m,f){const W=window.WH_TABLE,k=m/1000;
  if(k<W.lo[0])return 0;
  if(k>=W.last){const t=W.t10[f-1];if(m===1e7)return t;let add;
    if(m<=1.4e7)add=(m-1e7)*.98*.35+25000;else if(m<=2.8e7)add=1397000+(m-1.4e7)*.98*.38;
    else if(m<=3e7)add=6610600+(m-2.8e7)*.98*.40;else if(m<=4.5e7)add=7394600+(m-3e7)*.40;
    else if(m<=8.7e7)add=13394600+(m-4.5e7)*.42;else add=31034600+(m-8.7e7)*.45;
    return fl10(t+add)}
  let a=0,b=W.lo.length-1;while(a<b){const c=(a+b+1)>>1;W.lo[c]<=k?a=c:b=c-1}
  return W.v[a][f-1]}
function withholding(m,fam,kids,ratio){
  const f=Math.max(1,Math.floor(fam));
  let t=f<=11?whBase(m,f):Math.max(0,whBase(m,11)-(whBase(m,10)-whBase(m,11))*(f-11));
  const k=Math.max(0,Math.floor(kids)),cd=k<=0?0:k===1?20830:k===2?45830:45830+(k-2)*33330;
  t=Math.max(0,t-cd);
  return fl10(t*(ratio||100)/100)}
function netPay(annual,free,fam,kids,sevIn,ratio){
  const monthly=annual/(sevIn?13:12);
  const taxable=Math.max(0,monthly-free);
  const base=Math.min(6590000,Math.max(410000,Math.floor(taxable/1000)*1000));
  const pension=taxable?fl10(base*0.0475):0;
  const health=fl10(taxable*0.03595);
  const care=fl10(health*0.1314);
  const emp=fl10(taxable*0.009);
  const itax=withholding(taxable,fam,kids,ratio),ltax=fl10(itax*0.1);
  const ded=pension+health+care+emp+itax+ltax;
  return{monthly,pension,health,care,emp,itax,ltax,ded,net:monthly-ded};
}
function sIn(){return{annual:num($('s-pay').value),free:num($('s-free').value),fam:Math.max(1,Math.floor(num($('s-fam').value))),kids:Math.floor(num($('s-kid').value))}}
function calcSalary(){
  const s=sIn();$('s-pay-kr').textContent=reading(s.annual);
  if(!s.annual){$('s-big').innerHTML=bigM(0);$('s-big-s').textContent='';$('s-lines').innerHTML='';$('s-body').innerHTML='';return}
  const r=netPay(s.annual,s.free,s.fam,s.kids,sev,whr);
  $('s-big').innerHTML=bigM(r.net);
  $('s-big-s').textContent=tf('annualNet',reading(Math.round(r.net*12/10000)*10000))+(sev?t('exSev'):'');
  $('s-lines').innerHTML=[[t('grossM'),r.monthly],[t('pension'),r.pension],[t('health'),r.health],[t('care'),r.care],[t('emp'),r.emp],
    [t('itax'),r.itax],[t('ltax'),r.ltax],[t('dedTotal'),r.ded,'strong']]
    .map(([a,b,c],i)=>`<li class="${c||''}"><span>${esc(a)}</span><span>${i>0&&!c?'−':''}${M(b)}</span></li>`).join('');
  const dp=r.ded/r.monthly*100;$('s-split-n').style.width=(100-dp)+'%';$('s-split-d').style.width=dp+'%';
  $('s-lg-n').textContent=tf('netPct',(100-dp).toFixed(1));$('s-lg-d').textContent=tf('dedPct',dp.toFixed(1));
  const steps=[];for(let a=3e7;a<=1e8;a+=1e7)steps.push(a);
  $('s-body').innerHTML=steps.map(a=>{const x=netPay(a,s.free,s.fam,s.kids,sev,whr);
    return`<tr><td>${salLabel(a)}</td><td>${won(x.monthly)}</td><td>${won(x.ded)}</td><td>${won(x.net)}</td><td>${won(x.net*12)}</td></tr>`}).join('');
}

/* ---------- 날짜 도우미 / dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const D=v=>{const [y,m,d]=String(v).split('-').map(Number);return y?Date.UTC(y,m-1,d):NaN};
const fmtD=t=>{const x=new Date(t);return `${x.getUTCFullYear()}.${pad(x.getUTCMonth()+1)}.${pad(x.getUTCDate())}`};
const addM=(t,n)=>{const x=new Date(t),y=x.getUTCFullYear(),m=x.getUTCMonth()+n,last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return Date.UTC(y,m,Math.min(x.getUTCDate(),last))};
const fullMonths=(a,b)=>{let m=0;while(addM(a,m+1)<=b)m++;return m};
const todayISO=(()=>{const x=new Date();return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`})();
const linesHTML=rows=>rows.map(([a,b,c])=>`<li class="${c||''}"><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('');

/* ---------- 퇴직금 / severance (근로자퇴직급여 보장법) ---------- */
function severance(S,E,pay,bonus,lpay){
  const R=E+864e5;                                   // 퇴직일 = 마지막 근무일 다음 날
  const days=Math.round((R-S)/864e5);                // 재직일수
  const P=addM(R,-3),pDays=Math.round((R-P)/864e5);  // 퇴직일 이전 3개월
  const wages=pay*3+bonus*3/12+lpay*3/12;
  const avg=wages/pDays,m=fullMonths(S,R);
  return{R,P,days,pDays,wages,avg,months:m,eligible:addM(S,12)<=R,amount:avg*30*days/365};
}
function calcSev(){
  const S=D($('sv-start').value),E=D($('sv-end').value),pay=num($('sv-pay').value);
  $('sv-pay-kr').textContent=reading(pay);
  const w=$('sv-warn');w.hidden=true;
  if(isNaN(S)||isNaN(E)){$('sv-big').innerHTML=bigM(0);$('sv-lines').innerHTML='';return}
  if(E<S){w.textContent=t('svBadDate');w.hidden=false;$('sv-big').innerHTML=bigM(0);$('sv-big-s').textContent='';$('sv-lines').innerHTML='';return}
  const r=severance(S,E,pay,num($('sv-bonus').value),num($('sv-lpay').value));
  if(!r.eligible){w.textContent=t('svNo');w.hidden=false}
  $('sv-tag').textContent=`${fmtD(S)} – ${fmtD(E)}`;
  $('sv-big').innerHTML=bigM(r.eligible?r.amount:0);
  $('sv-big-s').textContent=r.eligible?reading(r.amount):'';
  $('sv-lines').innerHTML=linesHTML([[t('svTenure'),tf('svTenureV',Math.floor(r.months/12),r.months%12,r.days.toLocaleString('en-US'))],
    [t('svPeriod'),`${fmtD(r.P)} – ${fmtD(r.R-864e5)} · ${tf('svPeriodV',r.pDays)}`],[t('svWages'),M(r.wages)],[t('svAvg'),M(r.avg)]]);
}

/* ---------- 연차 / annual leave (근로기준법 제60조) ---------- */
const leaveDays=n=>Math.min(25,15+Math.floor((n-1)/2));
function calcLeave(){
  const S=D($('lv-start').value),B=D($('lv-base').value);
  if(isNaN(S)||isNaN(B)||B<S){$('lv-big').textContent='-';$('lv-big-s').textContent='';$('lv-lines').innerHTML='';$('lv-body').innerHTML='';return}
  const m=fullMonths(S,B),y=Math.floor(m/12);
  const cur=y<1?Math.min(11,m):leaveDays(y);
  $('lv-tag').textContent=fmtD(S);
  $('lv-big').textContent=tf('lvDays',cur);
  $('lv-big-s').textContent=tf('lvThisSub',fmtD(B))+(y>=1?' · '+tf('lvYearN',y)+' ('+fmtD(addM(S,12*y))+')':'');
  const wage=num($('lv-wage').value),unused=num($('lv-unused').value),daily=wage/209*8;
  $('lv-lines').innerHTML=linesHTML([[t('lvNow'),tf('lvNowV',y,m%12)],[t('lvPay'),M(daily*unused),'strong'],[tf('lvPayV',M(daily),unused),'']]);
  const N=Math.max(y+3,5),rows=[[t('lvFirstYear'),`${fmtD(addM(S,1))} – ${fmtD(addM(S,11))}`,tf('lvDays',11),y<1]];
  for(let n=1;n<=N;n++)rows.push([tf('lvYearN',n),fmtD(addM(S,12*n)),tf('lvDays',leaveDays(n)),n===y]);
  $('lv-body').innerHTML=rows.map(([a,b,c,on])=>`<tr class="${on?'on':''}"><td style="text-align:left;font-family:var(--f-body)">${esc(a)}</td><td>${b}</td><td>${esc(c)}</td></tr>`).join('');
}
['lv-start','lv-base'].forEach(id=>$(id).addEventListener('change',calcLeave));
['lv-wage','lv-unused'].forEach(id=>$(id).addEventListener('input',e=>{fmtInput(e.target);calcLeave()}));
if(!$('sv-end').value)$('sv-end').value=todayISO;
if(!$('lv-base').value)$('lv-base').value=todayISO;

/* ---------- 결과 링크 공유 / share link (입력값을 주소의 ?뒤에 담음, 서버 저장 없음) ---------- */
const clean=s=>String(s).replace(/[|~]/g,' ').trim().slice(0,30);
const SHARE={
  salary:()=>({pay:num($('s-pay').value),free:num($('s-free').value),fam:num($('s-fam').value),kid:num($('s-kid').value),sev:sev,wh:whr}),
  severance:()=>({start:$('sv-start').value,end:$('sv-end').value,pay:num($('sv-pay').value),bonus:num($('sv-bonus').value),lpay:num($('sv-lpay').value)}),
  leave:()=>({start:$('lv-start').value,base:$('lv-base').value,wage:num($('lv-wage').value),unused:num($('lv-unused').value)}),
  saving:()=>({kind:savKind,amt:num($('g-amt').value),rate:num($('g-rate').value),term:num($('g-term').value),unit:$('g-unit').value,c:savComp,tax:num($('g-tax').value)}),
  loan:()=>({amt:num($('l-amt').value),rate:num($('l-rate').value),term:num($('l-term').value),unit:$('l-unit').value,m:method}),
  dutch:()=>{const o={mode:mode,r:unit};
    if(mode==='simple'){o.total=num($('d-total').value);o.n=num($('d-people').value)}
    else{o.p=people.map(p=>clean(p.name)).join('|');o.i=items.map(it=>[clean(it.name),it.amount,people.map(p=>it.who.has(p.id)?1:0).join('')].join('~'))}
    const ac=$('d-account').value.trim().slice(0,60);if(ac)o.acc=ac;
    return o}
};
function shareURL(tool){const q=new URLSearchParams(),o=SHARE[tool]();
  for(const k in o){Array.isArray(o[k])?o[k].forEach(v=>q.append(k,v)):q.set(k,o[k])}
  return location.origin+location.pathname+'?'+q.toString()+(PAGE?'':'#'+tool)}
function press(box,attr,val){box.querySelectorAll('['+attr+']').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute(attr)===String(val)))}
function applyShared(tool){
  const q=new URLSearchParams(location.search);if(![...q].length)return;
  const N=(k,max)=>{const s=q.get(k);return s!==null&&/^\d{1,12}(\.\d{1,4})?$/.test(s)?Math.min(+s,max):null};
  const setN=(id,k,max)=>{const v=N(k,max);if(v!==null)$(id).value=v.toLocaleString('en-US')};
  const setD=(id,k)=>{const s=q.get(k)||'';if(/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(D(s)))$(id).value=s};
  if(tool==='salary'){
    setN('s-pay','pay',1e11);setN('s-free','free',1e9);setN('s-fam','fam',99);setN('s-kid','kid',99);
    const sv=N('sev',1);if(sv!==null){sev=sv?1:0;press($('sevSeg'),'data-sev',sev)}
    const w=N('wh',120);if([80,100,120].includes(w)){whr=w;press($('whSeg'),'data-wh',w)}
  }else if(tool==='severance'){
    setD('sv-start','start');setD('sv-end','end');setN('sv-pay','pay',1e10);setN('sv-bonus','bonus',1e11);setN('sv-lpay','lpay',1e10);
  }else if(tool==='leave'){
    setD('lv-start','start');setD('lv-base','base');setN('lv-wage','wage',1e10);setN('lv-unused','unused',99);
  }else if(tool==='loan'){
    setN('l-amt','amt',1e12);const r=N('rate',100);if(r!==null)$('l-rate').value=String(r);
    const tm=N('term',600);if(tm!==null)$('l-term').value=String(Math.floor(tm));
    if(['y','m'].includes(q.get('unit')))$('l-unit').value=q.get('unit');
    const m=q.get('m');if(['annuity','principal','bullet'].includes(m)){method=m;press($('methodSeg'),'data-m',m)}
  }else if(tool==='saving'){
    const k=q.get('kind');if(['deposit','saving'].includes(k)){savKind=k;press($('savKindSeg'),'data-k',k)}
    const c=q.get('c');if(['simple','compound'].includes(c)){savComp=c;press($('savCompSeg'),'data-c',c)}
    setN('g-amt','amt',1e12);const r=N('rate',100);if(r!==null)$('g-rate').value=String(r);
    const tm=N('term',600);if(tm!==null)$('g-term').value=String(Math.floor(tm));
    if(['y','m'].includes(q.get('unit')))$('g-unit').value=q.get('unit');
    const tx=N('tax',100);if(tx!==null)$('g-tax').value=String(tx);
  }else if(tool==='dutch'){
    const r=N('r',1000);if([1,10,100,1000].includes(r)){unit=r;press($('roundChips'),'data-unit',r)}
    const ac=(q.get('acc')||'').trim().slice(0,60);if(ac)$('d-account').value=ac;
    if(q.get('mode')==='items'){
      const names=(q.get('p')||'').split('|').map(s=>s.trim().slice(0,30)),its=q.getAll('i').slice(0,30);
      if(names.length>=2&&names.length<=20&&its.length){
        people.length=0;names.forEach(n=>people.push({id:++uid,name:n}));
        items.length=0;its.forEach(s=>{const [nm,am,w]=s.split('~'),a=/^\d{1,12}$/.test(am||'')?+am:0;
          items.push({id:++uid,name:(nm||'').trim().slice(0,30),amount:a,who:new Set(people.filter((p,i)=>(w||'')[i]==='1').map(p=>p.id))})});
        setMode('items')}
    }else if(q.get('mode')==='simple'){setN('d-total','total',1e11);setN('d-people','n',1000)}
  }
}
let toastTimer;
document.querySelectorAll('.sharebox').forEach(box=>{
  const btn=box.querySelector('.shareBtn'),toast=box.querySelector('.toast'),inp=box.querySelector('.sharelink');
  const say=m=>{toast.textContent=m;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.textContent='',2500)};
  btn.onclick=async()=>{
    const tool=box.dataset.share,url=shareURL(tool);
    try{window.gtag&&gtag('event','share',{method:'link',content_type:tool})}catch(e){}
    if(navigator.share&&matchMedia('(pointer:coarse)').matches){
      try{await navigator.share({title:document.title,url});return}catch(e){if(e&&e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(url);inp.hidden=true;say(t('linkCopied'));return}catch(e){}
    inp.value=url;inp.hidden=false;inp.focus();inp.select();say(t('linkManual'))};
});

/* ---------- start ---------- */
const h=location.hash.slice(1);
showTab(TABS.includes(PAGE)?PAGE:TABS.includes(h)?h:(onSite?'salary':(store.get('tab')||'salary')));
applyShared(curTab);
applyLang();renderAll();calcLoan();calcSav();calcSalary();calcSev();calcLeave();
})();
</script>
