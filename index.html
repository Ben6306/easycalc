<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://easycalc.co.kr/">
<link rel="alternate" hreflang="ko" href="https://easycalc.co.kr/">
<link rel="alternate" hreflang="en" href="https://easycalc.co.kr/en/">
<link rel="alternate" hreflang="x-default" href="https://easycalc.co.kr/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EasyCalc">
<meta property="og:title" content="EasyCalc - 더치페이·대출이자·연봉 실수령액 계산기">
<meta property="og:description" content="더치페이, 대출이자, 연봉 실수령액을 설치·가입 없이 바로 계산하는 생활 계산기">
<meta property="og:url" content="https://easycalc.co.kr/">
<meta property="og:locale" content="ko_KR">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>더치페이·대출이자·연봉 실수령액 계산기 | EasyCalc</title>
<meta name="description" content="더치페이, 대출이자, 연봉 실수령액을 설치·가입 없이 바로 계산하는 생활 계산기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column (phone-first). Header with language switch, tabs, inputs card, then a receipt-style result. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#15201B; --muted:#5C6A64; --line:#D9E1DD;
  --accent:#0E6A55; --accent-ink:#FFFFFF; --accent-soft:#E0EFE9; --interest:#B5532B; --interest-soft:#F6E6DE;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E6EDEA; --muted:#93A29C; --line:#28332F;
  --accent:#4CC3A0; --accent-ink:#0B1411; --accent-soft:#1A2E27; --interest:#E38B60; --interest-soft:#33231C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E6EDEA; --muted:#93A29C; --line:#28332F;
  --accent:#4CC3A0; --accent-ink:#0B1411; --accent-soft:#1A2E27; --interest:#E38B60; --interest-soft:#33231C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand{font-family:var(--f-display);font-size:34px;line-height:1;letter-spacing:-.5px}
.brand b{color:var(--accent);font-weight:400}
.tag{color:var(--muted);font-size:13px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.lang button{font:600 13px var(--f-body);border:0;border-radius:999px;padding:6px 12px;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px;gap:4px}
.tabs button{font:600 15px var(--f-body);border:0;border-radius:7px;padding:11px 6px;background:transparent;color:var(--muted);cursor:pointer;line-height:1.25}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row > *{min-width:0}
.inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px}
.inbox:focus-within{border-color:var(--accent)}
.inbox input,.inbox select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 18px var(--f-num);padding:11px 0;outline:none;text-align:right}
.inbox select{text-align:left;font:600 15px var(--f-body);cursor:pointer}
.inbox span{color:var(--muted);font-size:14px;margin-left:6px;white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted);min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.seg button{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:10px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/* receipt */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px;position:relative}
.receipt::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:6px;
  background:radial-gradient(circle at 6px 6px,var(--bg) 4px,transparent 4.5px) 0 0/12px 12px repeat-x}
.rhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.big{font:600 40px/1.1 var(--f-num);letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--accent);overflow-wrap:anywhere}
.big small{font:500 16px var(--f-body);color:var(--ink);margin-left:4px;letter-spacing:0}
.dash{border:0;border-top:1px dashed var(--line);margin:2px 0}
.lines{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lines li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lines li span:first-child{color:var(--muted);min-width:0}
.lines li span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.lines li.strong span{color:var(--ink);font-weight:600}

textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13.5px/1.6 var(--f-body);padding:10px 12px;resize:vertical;min-height:110px}
.btn{font:600 15px var(--f-body);border:0;border-radius:8px;padding:12px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{font-size:13px;color:var(--accent);font-weight:600}

/* itemized */
.people{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.person{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);padding:2px 4px 2px 10px}
.person input{width:5.2em;border:0;background:transparent;color:var(--ink);font:500 14px var(--f-body);padding:5px 0;outline:none}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;width:26px;height:26px;border-radius:50%;cursor:pointer}
.x:hover{background:var(--line);color:var(--ink)}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.item-top{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.item-top > *{min-width:0}
.item-top .inbox{background:var(--surface)}
.item-top .name input{text-align:left;font:600 15px var(--f-body)}

/* loan */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font:600 20px var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted)}
.stat.int .v{color:var(--interest)}
.split{height:14px;border-radius:999px;overflow:hidden;display:flex;background:var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp-row{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center;font-size:13.5px}
.cmp-row .nm{min-width:0;line-height:1.3}
.cmp-row .bar{position:relative;height:28px;background:var(--bg);border-radius:6px;overflow:hidden}
.cmp-row .bar i{position:absolute;inset:0 auto 0 0;background:var(--interest-soft);border-right:2px solid var(--interest)}
.cmp-row .bar b{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 13px var(--f-num);font-variant-numeric:tabular-nums}
.cmp-row.on .bar i{background:var(--interest);opacity:.85}
.cmp-row.on .nm{font-weight:700}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:600;font-size:12px}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:center}
tbody tr:nth-child(12n) td{border-bottom-color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0}
footer{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
@media (max-width:420px){.big{font-size:34px}.item-top{grid-template-columns:1fr auto}.item-top .amt{grid-column:1 / -1;grid-row:2}}
@media (prefers-reduced-motion:no-preference){.cmp-row .bar i,.split i{transition:width .35s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandbox">
      <div class="brand">Easy<b>Calc</b></div>
      <div class="tag" data-t="tag"></div>
    </div>
    <div class="lang" role="group" aria-label="Language / 언어">
      <button data-lang="ko" aria-pressed="true" lang="ko">한국어</button>
      <button data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-dutch" aria-controls="dutch" aria-selected="true" data-t="tabDutch"></button>
    <button role="tab" id="tab-loan" aria-controls="loan" aria-selected="false" data-t="tabLoan"></button>
    <button role="tab" id="tab-salary" aria-controls="salary" aria-selected="false" data-t="tabSalary"></button>
  </div>

  <!-- ===== 더치페이 / Bill split ===== -->
  <section class="panel" id="dutch" role="tabpanel" aria-labelledby="tab-dutch">
    <div class="card">
      <div><h2 data-t="dutchH"></h2><p class="lede" data-t="dutchLede"></p></div>
      <div class="seg" role="group">
        <button id="mode-simple" aria-pressed="true" data-t="modeSimple"></button>
        <button id="mode-items" aria-pressed="false" data-t="modeItems"></button>
      </div>

      <div id="simpleBox" class="panel">
        <div class="row">
          <div class="field"><label for="d-total" data-t="total"></label>
            <div class="inbox"><input id="d-total" inputmode="numeric" value="87,000"><span data-t="cur"></span></div>
            <div class="hint" id="d-total-kr"></div></div>
          <div class="field"><label for="d-people" data-t="people"></label>
            <div class="inbox"><input id="d-people" inputmode="numeric" value="4"><span data-t="ppl"></span></div></div>
        </div>
      </div>

      <div id="itemsBox" class="panel" hidden>
        <div class="field"><span class="lbl" data-t="attendees"></span>
          <div class="people" id="peopleList"></div></div>
        <div class="field"><span class="lbl" data-t="itemsLbl"></span>
          <div class="panel" id="itemList" style="gap:10px"></div>
          <div class="btnrow"><button class="btn ghost" id="addItem" data-t="addItem"></button></div></div>
      </div>

      <div class="field"><span class="lbl" data-t="roundLbl"></span>
        <div class="chips" id="roundChips">
          <button class="chip" data-unit="1" aria-pressed="false"></button>
          <button class="chip" data-unit="10" aria-pressed="false"></button>
          <button class="chip" data-unit="100" aria-pressed="true"></button>
          <button class="chip" data-unit="1000" aria-pressed="false"></button>
        </div></div>
      <div class="field"><label for="d-account" data-t="account"></label>
        <div class="inbox"><input id="d-account" data-tp="accountPh" style="text-align:left;font:500 15px var(--f-body)"></div></div>
    </div>

    <div class="receipt" aria-live="polite">
      <div class="rhead"><span data-t="receipt"></span><span id="d-date"></span></div>
      <div><div class="lbl" id="d-headline-label"></div><div class="big" id="d-big">0</div></div>
      <hr class="dash">
      <ul class="lines" id="d-lines"></ul>
      <hr class="dash">
      <label class="lbl" for="d-share" data-t="shareLbl"></label>
      <textarea id="d-share" readonly></textarea>
      <div class="btnrow"><button class="btn" id="d-copy" data-t="copy"></button><span class="toast" id="d-toast" role="status"></span></div>
    </div>
  </section>

  <!-- ===== 대출이자 / Loan ===== -->
  <section class="panel" id="loan" role="tabpanel" aria-labelledby="tab-loan" hidden>
    <div class="card">
      <div><h2 data-t="loanH"></h2><p class="lede" data-t="loanLede"></p></div>
      <div class="field"><label for="l-amt" data-t="loanAmt"></label>
        <div class="inbox"><input id="l-amt" inputmode="numeric" value="300,000,000"><span data-t="cur"></span></div>
        <div class="hint" id="l-amt-kr"></div>
        <div class="chips" id="loanChips">
          <button class="chip" data-add="10000000" data-t="add10m"></button>
          <button class="chip" data-add="50000000" data-t="add50m"></button>
          <button class="chip" data-add="100000000" data-t="add100m"></button>
          <button class="chip" data-add="0" data-t="clear"></button>
        </div></div>
      <div class="row">
        <div class="field"><label for="l-rate" data-t="rate"></label>
          <div class="inbox"><input id="l-rate" inputmode="decimal" value="4.2"><span>%</span></div></div>
        <div class="field"><label for="l-term" data-t="term"></label>
          <div class="inbox"><input id="l-term" inputmode="numeric" value="30">
            <select id="l-unit" data-ta="termUnit" style="flex:0 0 auto;margin-left:6px"><option value="y" data-t="years"></option><option value="m" data-t="months"></option></select></div></div>
      </div>
      <div class="field"><span class="lbl" data-t="method"></span>
        <div class="seg" id="methodSeg">
          <button data-m="annuity" aria-pressed="true" data-t="m_annuity"></button>
          <button data-m="principal" aria-pressed="false" data-t="m_principal"></button>
          <button data-m="bullet" aria-pressed="false" data-t="m_bullet"></button>
        </div>
        <div class="hint" id="l-method-desc"></div></div>
    </div>

    <div class="card" aria-live="polite">
      <div class="stats">
        <div class="stat"><span class="k" id="l-pay-k"></span><span class="v" id="l-pay">-</span><span class="s" id="l-pay-s"></span></div>
        <div class="stat int"><span class="k" data-t="totInt"></span><span class="v" id="l-int">-</span><span class="s" id="l-int-s"></span></div>
        <div class="stat"><span class="k" data-t="totPay"></span><span class="v" id="l-tot">-</span><span class="s" id="l-tot-s"></span></div>
      </div>
      <div class="split" aria-hidden="true"><i id="split-p" style="background:var(--accent)"></i><i id="split-i" style="background:var(--interest)"></i></div>
      <div class="legend"><span style="--c:var(--accent)" id="lg-p"></span><span style="--c:var(--interest)" id="lg-i"></span></div>
    </div>

    <div class="card">
      <h2 data-t="cmpH"></h2>
      <div class="cmp" id="cmp"></div>
      <p class="note" data-t="cmpNote"></p>
    </div>

    <div class="card">
      <div class="btnrow" style="justify-content:space-between"><h2 data-t="schedH"></h2><button class="btn ghost" id="l-all"></button></div>
      <div class="tablewrap"><table>
        <thead><tr><th data-t="thNo"></th><th data-t="thPay"></th><th data-t="thPrin"></th><th data-t="thInt"></th><th data-t="thBal"></th></tr></thead>
        <tbody id="l-body"></tbody></table></div>
      <p class="note" data-t="schedNote"></p>
    </div>
  </section>

  <!-- ===== 연봉 실수령 / Take-home ===== -->
  <section class="panel" id="salary" role="tabpanel" aria-labelledby="tab-salary" hidden>
    <div class="card">
      <div><h2 data-t="salH"></h2><p class="lede" data-t="salLede"></p></div>
      <div class="field"><label for="s-pay" data-t="salAnnual"></label>
        <div class="inbox"><input id="s-pay" inputmode="numeric" value="50,000,000"><span data-t="cur"></span></div>
        <div class="hint" id="s-pay-kr"></div>
        <div class="chips" id="salChips">
          <button class="chip" data-sadd="1000000" data-t="add1m"></button>
          <button class="chip" data-sadd="5000000" data-t="add5m"></button>
          <button class="chip" data-sadd="10000000" data-t="add10m"></button>
          <button class="chip" data-sadd="0" data-t="clear"></button>
        </div></div>
      <div class="field"><span class="lbl" data-t="sev"></span>
        <div class="seg" id="sevSeg">
          <button data-sev="0" aria-pressed="true" data-t="sevSep"></button>
          <button data-sev="1" aria-pressed="false" data-t="sevIn"></button>
        </div>
        <div class="hint" data-t="sevHint"></div></div>
      <div class="row">
        <div class="field"><label for="s-free" data-t="nontax"></label>
          <div class="inbox"><input id="s-free" inputmode="numeric" value="200,000"><span data-t="cur"></span></div>
          <div class="hint" data-t="nontaxHint"></div></div>
        <div class="field"><label for="s-fam" data-t="fam"></label>
          <div class="inbox"><input id="s-fam" inputmode="numeric" value="1"><span data-t="ppl"></span></div></div>
      </div>
      <div class="field"><label for="s-kid" data-t="kids"></label>
        <div class="inbox"><input id="s-kid" inputmode="numeric" value="0"><span data-t="ppl"></span></div></div>
    </div>

    <div class="receipt" aria-live="polite">
      <div class="rhead"><span data-t="payslip"></span><span data-t="rateTag"></span></div>
      <div><div class="lbl" data-t="netEst"></div><div class="big" id="s-big">0</div>
        <div class="hint" id="s-big-s"></div></div>
      <hr class="dash">
      <ul class="lines" id="s-lines"></ul>
      <div class="split" aria-hidden="true"><i id="s-split-n" style="background:var(--accent)"></i><i id="s-split-d" style="background:var(--interest)"></i></div>
      <div class="legend"><span style="--c:var(--accent)" id="s-lg-n"></span><span style="--c:var(--interest)" id="s-lg-d"></span></div>
    </div>

    <div class="card">
      <h2 data-t="rangeH"></h2>
      <div class="tablewrap"><table>
        <thead><tr><th data-t="thSal"></th><th data-t="thGross"></th><th data-t="thDed"></th><th data-t="thNet"></th><th data-t="thNetY"></th></tr></thead>
        <tbody id="s-body"></tbody></table></div>
      <p class="note" data-t="rangeNote"></p>
    </div>

    <div class="card">
      <h2 data-t="howH"></h2>
      <ul class="lines">
        <li><span data-t="howPension"></span><span>4.75%</span></li>
        <li><span data-t="health"></span><span>3.595%</span></li>
        <li><span data-t="howCare"></span><span>13.14%</span></li>

  if(lang==='ko'){const e=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4),r=n%1e4,p=[];
    if(e)p.push(e.toLocaleString('ko-KR')+'억');if(m)p.push(m.toLocaleString('ko-KR')+'만');if(r)p.push(r.toLocaleString('ko-KR'));return p.join(' ')+' 원'}
  const f=(v,w)=>(+v.toFixed(2)).toLocaleString('en-US')+' '+w+' won';
  return n>=1e9?f(n/1e9,'billion'):n>=1e6?f(n/1e6,'million'):n>=1e3?f(n/1e3,'thousand'):n+' won'}
function fmtInput(el){const v=num(el.value);el.value=v?v.toLocaleString(loc()):''}

  document.querySelectorAll('span[data-t="ppl"]').forEach(s=>s.hidden=!s.textContent);
  document.title=t('titles')[curTab];

  if(l===lang)return;

  // swap untouched default names to the new language
  people.forEach((p,i)=>{if(p.name===T[prev].defPeople[i])p.name=T[l].defPeople[i]});

  applyLang();renderAll();calcLoan();calcSalary();
}

  let lines=[],share=[];
  if(mode==='simple'){
    const total=num($('d-total').value),n=Math.max(0,Math.floor(num($('d-people').value)));
    $('d-total-kr').textContent=reading(total);
    const each=n?ceilU(total/n):0,col=each*n;
    $('d-headline-label').textContent=t('perPerson')(n);$('d-big').innerHTML=bigM(each);
    lines=[[t('totalAmt'),M(total)],[t('people'),t('pplN')(n)],[t('exact'),n?M(total/n):'-'],[t('collected'),M(col)],[t('leftover'),M(col-total)]];
    share=t('shareSimple')(M(total),n,M(each),uTxt);
  }else{
    const owe=new Map(people.map(p=>[p.id,0]));let total=0;
    items.forEach(it=>{const w=[...it.who].filter(id=>owe.has(id));total+=it.amount;if(w.length)w.forEach(id=>owe.set(id,owe.get(id)+it.amount/w.length))});
    const unassigned=items.filter(it=>it.amount&&![...it.who].some(id=>owe.has(id)));
    let col=0;const per=people.map(p=>{const v=ceilU(owe.get(p.id));col+=v;return[p,v]});
    $('d-headline-label').textContent=t('totalAmt');$('d-big').innerHTML=bigM(total);
    lines=per.map(([p,v])=>[p.name||t('noName'),M(v)]);
    lines.push([t('collected'),M(col),'strong']);lines.push([t('leftover'),M(col-total)]);
    if(unassigned.length)lines.push([t('unassigned'),unassigned.map(i=>i.name).join(', ')]);
    share=[t('shareHead')(M(total)),...items.filter(i=>i.amount).map(i=>t('shareItem')(i.name,M(i.amount),[...i.who].filter(id=>owe.has(id)).length)),'',
      ...per.map(([p,v])=>`${p.name||t('noName')}: ${M(v)}`)];
    if(uTxt)share.push(t('shareRound')(uTxt));
  }
  if(acc)share.push(t('payTo')+acc);
  $('d-lines').innerHTML=lines.map(([a,b,c])=>`<li class="${c||''}"><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('');
  $('d-share').value=share.join('\n');
}
$('d-copy').onclick=()=>{const ta=$('d-share'),ok=()=>{$('d-toast').textContent=t('copied');setTimeout(()=>$('d-toast').textContent='',2000)};
  const fb=()=>{ta.focus();ta.select();$('d-toast').textContent=t('selected')};
  try{navigator.clipboard.writeText(ta.value).then(ok,fb)}catch(e){fb()}};

/* ---------- 대출이자 / loan ---------- */
let method='annuity',showAll=false;
function schedule(P,rate,n,m){
  const r=rate/100/12,rows=[];let bal=P,ti=0;
  const pmt=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  for(let i=1;i<=n;i++){
    const it=Math.round(bal*r);let pr;
    if(i===n)pr=bal;else if(m==='annuity')pr=Math.min(bal,Math.round(pmt)-it);else if(m==='principal')pr=Math.round(P/n);else pr=0;
    bal-=pr;ti+=it;rows.push([i,pr+it,pr,it,Math.max(0,bal)]);
  }
  return{rows,ti,total:P+ti};
}
$('methodSeg').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;method=b.dataset.m;
  [...$('methodSeg').children].forEach(c=>c.setAttribute('aria-pressed',c===b));calcLoan()};
$('l-amt').addEventListener('input',e=>{fmtInput(e.target);calcLoan()});
['l-rate','l-term'].forEach(id=>$(id).addEventListener('input',calcLoan));$('l-unit').onchange=calcLoan;
$('loanChips').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;const a=+b.dataset.add,el=$('l-amt');
  el.value=a?(num(el.value)+a).toLocaleString(loc()):'';calcLoan();if(!a)el.focus()};
$('l-all').onclick=()=>{showAll=!showAll;calcLoan()};

function calcLoan(){
  const P=num($('l-amt').value),rate=Math.min(100,num($('l-rate').value)),tm=Math.floor(num($('l-term').value));
  const n=Math.min(600,$('l-unit').value==='y'?tm*12:tm);
  $('l-amt-kr').textContent=reading(P);$('l-method-desc').textContent=t('d_'+method);
  $('l-pay-k').textContent=method==='bullet'?t('monthlyInt'):t('monthlyPay')+(method==='principal'?t('firstMonth'):'');
  if(!P||!n){['l-pay','l-int','l-tot'].forEach(id=>$(id).textContent='-');['l-pay-s','l-int-s','l-tot-s'].forEach(id=>$(id).textContent='');
    $('l-body').innerHTML=`<tr><td colspan="5" style="text-align:center;font-family:var(--f-body)">${esc(t('enterLoan'))}</td></tr>`;$('cmp').innerHTML='';$('l-all').hidden=true;return}
  const s=schedule(P,rate,n,method),first=s.rows[0],last=s.rows[n-1];
  $('l-pay').textContent=M(method==='bullet'?first[3]:first[1]);
  $('l-pay-s').textContent=method==='principal'?t('lastMonth')(M(last[1])):method==='bullet'?t('atMaturity')(M(P)):t('sameFor')(n);
  $('l-int').textContent=M(s.ti);$('l-int-s').textContent=reading(s.ti);
  $('l-tot').textContent=M(s.total);$('l-tot-s').textContent=t('pctOfP')((s.total/P*100).toFixed(1));
  const ip=s.ti/s.total*100;$('split-p').style.width=(100-ip)+'%';$('split-i').style.width=ip+'%';
  $('lg-p').textContent=t('prinPct')((100-ip).toFixed(1));$('lg-i').textContent=t('intPct')(ip.toFixed(1));
  const all=['annuity','principal','bullet'].map(m=>[m,schedule(P,rate,n,m).ti]),mx=Math.max(...all.map(a=>a[1]))||1;
  $('cmp').innerHTML=all.map(([m,v])=>`<div class="cmp-row ${m===method?'on':''}"><span class="nm">${esc(t('m_'+m))}</span>
    <div class="bar"><i style="width:${Math.max(2,v/mx*100)}%"></i><b>${M(v)}</b></div></div>`).join('');
  const rows=showAll?s.rows:s.rows.slice(0,12);
  $('l-body').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${won(r[1])}</td><td>${won(r[2])}</td><td>${won(r[3])}</td><td>${won(r[4])}</td></tr>`).join('');
  $('l-all').textContent=showAll?t('show12'):t('showAll')(n);$('l-all').hidden=n<=12;
}

/* ---------- 연봉 실수령 / take-home (2026.7 rates) ---------- */
let sev=0;
const fl10=v=>Math.floor(v/10)*10;
function netPay(annual,free,fam,kids,sevIn){
  const monthly=annual/(sevIn?13:12);
  const taxable=Math.max(0,monthly-free);
  const base=Math.min(6590000,Math.max(410000,Math.floor(taxable/1000)*1000));
  const pension=taxable?fl10(base*0.0475):0;
  const health=fl10(taxable*0.03595);
  const care=fl10(health*0.1314);
  const emp=fl10(taxable*0.009);
  const G=taxable*12;
  let wd=G<=5e6?G*.7:G<=15e6?3.5e6+(G-5e6)*.4:G<=45e6?7.5e6+(G-15e6)*.15:G<=1e8?12e6+(G-45e6)*.05:14.75e6+(G-1e8)*.02;
  wd=Math.min(wd,2e7);
  const ti=Math.max(0,G-wd-1.5e6*Math.max(1,fam)-pension*12-(health+care+emp)*12);
  const B=[[14e6,.06,0],[50e6,.15,1.26e6],[88e6,.24,5.76e6],[150e6,.35,15.44e6],[300e6,.38,19.94e6],[500e6,.40,25.94e6],[1e9,.42,35.94e6],[Infinity,.45,65.94e6]];
  const b=B.find(x=>ti<=x[0]);const calc=Math.max(0,ti*b[1]-b[2]);
  let wc=calc<=1.3e6?calc*.55:715000+(calc-1.3e6)*.3;
  const cap=G<=33e6?740000:G<=70e6?Math.max(660000,740000-(G-33e6)*.008):G<=120e6?Math.max(500000,660000-(G-70e6)/2):Math.max(200000,500000-(G-120e6)/2);
  wc=Math.min(wc,cap);
  const kidC=kids<=0?0:kids===1?250000:kids===2?550000:950000+(kids-3)*400000;
  const annualTax=Math.max(0,calc-wc-kidC-130000);
  const itax=fl10(annualTax/12),ltax=fl10(itax*0.1);
  const ded=pension+health+care+emp+itax+ltax;
  return{monthly,pension,health,care,emp,itax,ltax,ded,net:monthly-ded};
}
function sIn(){return{annual:num($('s-pay').value),free:num($('s-free').value),fam:Math.max(1,Math.floor(num($('s-fam').value))),kids:Math.floor(num($('s-kid').value))}}
function calcSalary(){
  const s=sIn();$('s-pay-kr').textContent=reading(s.annual);
  if(!s.annual){$('s-big').innerHTML=bigM(0);$('s-big-s').textContent='';$('s-lines').innerHTML='';$('s-body').innerHTML='';return}
  const r=netPay(s.annual,s.free,s.fam,s.kids,sev);
  $('s-big').innerHTML=bigM(r.net);
  $('s-big-s').textContent=t('annualNet')(reading(Math.round(r.net*12/10000)*10000))+(sev?t('exSev'):'');
  $('s-lines').innerHTML=[[t('grossM'),r.monthly],[t('pension'),r.pension],[t('health'),r.health],[t('care'),r.care],[t('emp'),r.emp],
    [t('itax'),r.itax],[t('ltax'),r.ltax],[t('dedTotal'),r.ded,'strong']]
    .map(([a,b,c],i)=>`<li class="${c||''}"><span>${esc(a)}</span><span>${i>0&&!c?'−':''}${M(b)}</span></li>`).join('');
  const dp=r.ded/r.monthly*100;$('s-split-n').style.width=(100-dp)+'%';$('s-split-d').style.width=dp+'%';
  $('s-lg-n').textContent=t('netPct')((100-dp).toFixed(1));$('s-lg-d').textContent=t('dedPct')(dp.toFixed(1));
  const steps=[];for(let a=3e7;a<=1e8;a+=1e7)steps.push(a);
  $('s-body').innerHTML=steps.map(a=>{const x=netPay(a,s.free,s.fam,s.kids,sev);
    return`<tr><td>${t('salLabel')(a)}</td><td>${won(x.monthly)}</td><td>${won(x.ded)}</td><td>${won(x.net)}</td><td>${won(x.net*12)}</td></tr>`}).join('');
}
['s-pay','s-free','s-fam','s-kid'].forEach(id=>$(id).addEventListener('input',e=>{fmtInput(e.target);calcSalary()}));
$('sevSeg').onclick=e=>{const b=e.target.closest('[data-sev]');if(!b)return;sev=+b.dataset.sev;[...$('sevSeg').children].forEach(c=>c.setAttribute('aria-pressed',c===b));calcSalary()};
$('salChips').onclick=e=>{const b=e.target.closest('[data-sadd]');if(!b)return;const a=+b.dataset.sadd,el=$('s-pay');
  el.value=a?(num(el.value)+a).toLocaleString(loc()):'';calcSalary();if(!a)el.focus()};
